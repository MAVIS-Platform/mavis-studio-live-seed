name: mavis-studio-live-seed

services:
  orders:
    image: __ORDERS_IMAGE__
    environment:
      PAYMENT_URL: http://orders-payment-route:8080
    expose:
      - "8080"
    depends_on:
      - orders-payment-route
    restart: "no"

  payment:
    image: __PAYMENT_IMAGE__
    expose:
      - "8080"
    restart: "no"

  orders-payment-route:
    image: __ROUTE_IMAGE__
    environment:
      UPSTREAM_URL: http://payment:8080
    expose:
      - "8080"
    depends_on:
      - payment
    restart: "no"

networks:
  default:
    internal: true
