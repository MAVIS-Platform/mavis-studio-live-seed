name: Publish Studio Live images

on:
  push:
    branches: [main]
    paths-ignore:
      - "docker-compose.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push service images
        run: |
          set -euo pipefail
          : > digests.env
          for service in orders payment orders-payment-route; do
            image="ghcr.io/mavis-platform/mavis-studio-live-seed-${service}:${GITHUB_SHA}"
            docker buildx build --push --tag "$image" "./${service}"
            digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            echo "${service}=${digest}" >> digests.env
          done
          cat digests.env

      - name: Pin digests in docker-compose.yml
        run: |
          python3 - <<'PY'
          from pathlib import Path

          digests = {}
          for line in Path("digests.env").read_text().splitlines():
              service, digest = line.split("=", 1)
              digests[service] = digest

          compose = Path("docker-compose.template.yml").read_text()
          for service, placeholder in {
              "orders": "__ORDERS_IMAGE__",
              "payment": "__PAYMENT_IMAGE__",
              "orders-payment-route": "__ROUTE_IMAGE__",
          }.items():
              compose = compose.replace(
                  placeholder,
                  f"ghcr.io/mavis-platform/mavis-studio-live-seed-{service}@{digests[service]}",
              )
          Path("docker-compose.yml").write_text(compose)
          PY

      - name: Commit digest-pinned compose
        run: |
          git config user.name "mavis-bot"
          git config user.email "mavis-bot@users.noreply.github.com"
          git add docker-compose.yml
          if git diff --cached --quiet; then
            echo "Compose already up to date"
          else
            git commit -m "chore(images): pin Studio Live digests for ${GITHUB_SHA} [skip ci]"
            git push
          fi
